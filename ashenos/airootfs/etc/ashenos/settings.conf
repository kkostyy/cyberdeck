# ============================================================
#  AshenOS — настройки по умолчанию для всех пользователей
#  Свои значения пользователь хранит в ~/.config/ashenos/settings.conf
#  Менять удобнее командой:  ashenos-settings set КЛЮЧ ЗНАЧЕНИЕ
#  Применить всё заново:     ashenos-settings apply
# ============================================================

# --- Тема (Параметры → Тема) ---
THEME=obsidian
ACCENT=orange
TINT=0

# --- Обои (Параметры → Обои) ---
# orange lava silk rainbow waves  или путь к своему файлу
WALLPAPER=waves

# --- Шрифты ---
FONT=Inter
FONT_SIZE=10
FONT_MONO=JetBrains Mono

# --- Клавиатура ---
KEYBOARD=us,ru
KEYBOARD_SWITCH=grp:alt_shift_toggle
NUMLOCK=on
# Экранная клавиатура (Maliit): on / off
VIRTUAL_KEYBOARD=on

# --- Экран ---
# Масштаб для экрана 4,3" 800×480: 1 или 1.25
SCALE=1
# Поворот: normal left right inverted
ROTATION=normal

# --- Ночная цветовая схема ---
# off — выключена, sunset — с 20:00 до 7:00, always — всегда
NIGHT=sunset
NIGHT_TEMP=4200

# --- Звук ---
VOLUME=64

# --- Уведомления ---
DND=off
NOTIFY_SHORT=3
NOTIFY_LONG=6

# --- Анимации ---
# 0 — без анимаций, 60 — обычно, 100 — медленно
ANIM=60

# --- Блокировка экрана ---
LOCK_AFTER_MIN=5

# --- Сеть ---
WIFI=on
BLUETOOTH=on

# --- Карты (ashen-maps) ---
# dark / light
MAPS_STYLE=dark
# папка с офлайн-плитками (пусто — ~/.local/share/ashen-maps/tiles)
MAPS_OFFLINE_DIR=
# ключ Google Maps (слой Google пока не подключён — задел на будущее)
MAPS_GOOGLE_KEY=
