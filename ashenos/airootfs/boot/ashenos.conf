# ============================================================
#  AshenOS — настройки первого запуска
#  Этот файл лежит на SD-карте в разделе ASHEN_BOOT.
#  Отредактируйте его на компьютере ДО первой загрузки Pi.
#  После первого запуска он переименуется в ashenos.conf.done
# ============================================================

# --- Система ---
HOSTNAME=ashenos
TIMEZONE=Europe/Tallinn
LOCALE=ru_RU.UTF-8
# Раскладки клавиатуры через запятую, переключение Alt+Shift
KEYBOARD=us,ru

# --- Пользователь ---
# Если оставить USERNAME=alarm, будет использован стандартный пользователь alarm.
USERNAME=alarm
# Пароль задаётся один раз при первом запуске. Пусто — пароль не меняется (alarm).
PASSWORD=

# --- Wi-Fi (можно оставить пустым и подключиться потом) ---
WIFI_SSID=
WIFI_PASSWORD=
# Код страны для Wi-Fi (EE, RU, DE ...)
WIFI_COUNTRY=EE

# --- Доступ ---
SSH=yes
VNC=no

# --- Внешний вид (можно поменять позже командой ashenos-settings) ---
# Темы: obsidian cyberpunk nightowl kanagawa tokyo mocha gruvbox espresso nord
#       dracula solarized monokai ocean ayu github everforest rose horizon
THEME=obsidian
# Оттенок: auto orange red pink yellow green teal blue purple white или #rrggbb
ACCENT=orange
# Окрашивать фон оттенком: 0 — нет, 1 — лёгкие, 2 — насыщенные
TINT=0
