<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Иконка терминала</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="Иконка приложения Терминал: тёмная плитка с капсулой и символом приглашения" style="position: relative; width: 1024px; height: 1024px; overflow: hidden; background: #000000">
  <!-- tile -->
  <div aria-hidden="true" style="position: absolute; left: 164px; top: 185px; width: 696px; height: 694px; border-radius: 150px; background: radial-gradient(120% 90% at 85% 8%, #46464c 0%, #34343a 32%, #26262a 62%, #1c1c1f 100%); box-shadow: inset 0 3px 2px rgba(255,255,255,0.28), inset 0 -4px 8px rgba(0,0,0,0.5), inset 3px 0 3px rgba(255,255,255,0.10), inset -3px 0 3px rgba(255,255,255,0.06), 0 30px 60px rgba(0,0,0,0.6)"></div>
  <!-- outer rim -->
  <div aria-hidden="true" style="position: absolute; left: 162px; top: 183px; width: 700px; height: 698px; border-radius: 152px; border: 2px solid rgba(255,255,255,0.14)"></div>
  <!-- inset pill -->
  <div aria-hidden="true" style="position: absolute; left: 234px; top: 540px; width: 556px; height: 264px; border-radius: 118px; background: linear-gradient(180deg, #121214 0%, #19191b 60%, #1d1d20 100%); box-shadow: inset 0 10px 18px rgba(0,0,0,0.85), inset 0 2px 3px rgba(0,0,0,0.9), 0 2px 1px rgba(255,255,255,0.10), 0 -1px 0 rgba(0,0,0,0.4)"></div>
  <!-- >_ glyph -->
  <svg aria-hidden="true" style="position: absolute; left: 300px; top: 588px" width="300" height="180" viewBox="0 0 300 180">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9a9aa0"></stop>
        <stop offset="1" stop-color="#7a7a80"></stop>
      </linearGradient>
    </defs>
    <path d="M 20 12 L 112 78 L 20 144" fill="none" stroke="#3a3a3f" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter" transform="translate(0 2)"></path>
    <path d="M 20 12 L 112 78 L 20 144" fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter"></path>
    <rect x="124" y="134" width="154" height="22" fill="#3a3a3f" transform="translate(0 2)"></rect>
    <rect x="125" y="135" width="152" height="18" fill="url(#g)"></rect>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":1024}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
