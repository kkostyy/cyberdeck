<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1024,"height":1024}}'>

  renderVals() {
    const dark = this.props.dark ?? false;
    return {
      rootStyle: `position:relative;width:1024px;height:1024px;overflow:hidden;background:${dark ? '#111113' : '#f5f5f7'}`

}
