<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экран 800×480 (5″)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 800px; height: 480px; overflow: hidden; background: #000">
  <dc-import name="System" screen="800x480" hint-size="800px,480px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
